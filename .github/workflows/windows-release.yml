# Upstream's release pipeline, restricted to Windows x64. Manual runs keep artifacts;
# a vX.Y.Z tag matching Cargo.toml publishes them. No browser-store or website deployment.
name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: pwsh

jobs:
  geo:
    if: github.repository == 'PrudhviBojanapu/misterdownloadmanager'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: IP-to-country table
        run: |
          python tools\geo\build.py --release
          if ($LASTEXITCODE) { throw "IP-to-country table build failed" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: geo-data
          path: crates/geo/data/*
          retention-days: 1
          if-no-files-found: error

  windows:
    name: windows-x64
    needs: geo
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Preserve source line endings
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw "Git line-ending configuration failed" }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: geo-data
          path: crates/geo/data

      - name: Toolchain
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE) {
            rustup toolchain install
            if ($LASTEXITCODE) { throw "Rust toolchain installation failed" }
          }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw "Rust target installation failed" }

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-x86_64-pc-windows-msvc-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-x86_64-pc-windows-msvc-cargo-

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME but Cargo.toml says $v" }

      - name: NASM
        run: |
          choco install nasm --version 2.16.3 --no-progress -y
          if ($LASTEXITCODE) { throw "NASM installation failed" }
          "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Tests
        run: |
          cargo test --workspace --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw "Workspace tests failed" }

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { throw "Inno Setup installation failed" }
          }

      - name: Code-signing certificate
        id: cert
        env:
          PFX: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if (-not $env:PFX) { "No certificate: building unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe is unavailable" }
          "command=`"$($signtool.FullName)`" sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f `"$pfx`" /p `"$env:PASSWORD`" `$f" >> $env:GITHUB_OUTPUT

      - name: Installer and portable zip
        env:
          MDM_SIGN_COMMAND: ${{ steps.cert.outputs.command }}
        run: |
          if (Test-Path target\dist) { Remove-Item -LiteralPath target\dist -Recurse -Force }
          & .\tools\installer\build.ps1 -Arch x64

      - name: Smoke test
        run: |
          python tools\installer\smoke.py target\x86_64-pc-windows-msvc\release x64
          if ($LASTEXITCODE) { throw "Release smoke test failed" }

      - name: Symbols
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $exes = "misterdownloadmanager", "misterdownloadmanager-nmhost", "misterdownloadmanager-cli", "misterdownloadmanager-mcp" |
            ForEach-Object { "target\x86_64-pc-windows-msvc\release\$_.exe" }
          python tools\installer\symbols.py windows-x64 $v target\dist @exes
          if ($LASTEXITCODE) { throw "Symbols failed" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: target/dist/*
          retention-days: 1
          if-no-files-found: error

  extension:
    if: github.repository == 'PrudhviBojanapu/misterdownloadmanager'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Preserve source line endings
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE) { throw "Git line-ending configuration failed" }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Tests
        run: |
          node tools\extension\test.mjs
          if ($LASTEXITCODE) { throw "Browser extension tests failed" }

      - name: Chromium zip and Firefox .xpi
        run: |
          & .\tools\extension\pack.ps1
          node tools\extension\check-pack.mjs
          if ($LASTEXITCODE) { throw "Browser extension packages are invalid" }
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          New-Item -ItemType Directory -Force target\dist | Out-Null
          Copy-Item target\extension\mdm-chromium.zip "target\dist\MisterDownloadManager-$v-extension-chromium.zip"
          Copy-Item target\extension\mdm-firefox.xpi "target\dist\MisterDownloadManager-$v-extension-firefox.xpi"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension
          path: target/dist/*
          retention-days: 1
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, extension]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/MisterDownloadManager-*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MDM_RELEASE_KEY: ${{ secrets.MDM_RELEASE_KEY }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart("v")
          foreach ($f in "setup.exe", "portable.zip", "x64.zip") {
            if (-not (Test-Path "dist\MisterDownloadManager-$v-$f")) { throw "x64 Windows' $f isn't there: no release" }
          }
          Remove-Item dist\SHA256SUMS*.txt -ErrorAction SilentlyContinue
          $files = Get-ChildItem dist -File | Sort-Object Name
          $sums = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content -Encoding ascii dist\SHA256SUMS.txt $sums
          if ($env:MDM_RELEASE_KEY) {
            $key = Join-Path $env:RUNNER_TEMP "mdm-release.asc"
            Set-Content -Encoding ascii $key $env:MDM_RELEASE_KEY
            gpg --batch --quiet --import $key
            $result = $LASTEXITCODE
            Remove-Item -LiteralPath $key
            if ($result) { throw "Importing the release key failed" }
            gpg --batch --yes --detach-sign --local-user 5826D399249DE856EA087D802E293C28E8A69D74 `
              --output dist\SHA256SUMS.txt.sig dist\SHA256SUMS.txt
            if ($LASTEXITCODE) { throw "Signing SHA256SUMS.txt failed" }
            gpg --batch --verify dist\SHA256SUMS.txt.sig dist\SHA256SUMS.txt
            if ($LASTEXITCODE) { throw "The checksum signature doesn't verify" }
          } else {
            Write-Warning "MDM_RELEASE_KEY isn't set: this release is unsigned, and MDM won't update to it by itself."
          }
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## |\z)")
          $notice = "Windows x64 build of the PrudhviBojanapu fork, including its window and duplicate-download fixes. " +
            "This is not an official upstream release; the in-app updater still targets upstream. " +
            "Without a configured code-signing certificate, Windows SmartScreen may show a warning.`n`n" +
            "Source: $env:GITHUB_SHA`n`n"
          $all = (Get-ChildItem dist -File).FullName
          if ($m.Success -and $m.Groups[1].Value.Trim()) {
            $notes = $m.Groups[1].Value.Trim() -replace '\]\((?![a-z]+:|#)([^)\s]+)\)', "](https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_REF_NAME/`$1)"
            Set-Content -Encoding utf8 notes.md ($notice + $notes)
            gh release create $env:GITHUB_REF_NAME --latest --verify-tag `
              --title "Mister Download Manager $env:GITHUB_REF_NAME (Windows x64 fork)" --notes-file notes.md @all
          } else {
            Set-Content -Encoding utf8 notes.md $notice
            gh release create $env:GITHUB_REF_NAME --latest --verify-tag `
              --title "Mister Download Manager $env:GITHUB_REF_NAME (Windows x64 fork)" --notes-file notes.md --generate-notes @all
          }
          if ($LASTEXITCODE) { throw "Release publication failed" }
